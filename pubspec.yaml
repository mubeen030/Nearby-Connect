name: nearby_connect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.3.6
  go_router: ^7.0.0
  cached_network_image: ^3.2.3
  flutter_svg: ^2.0.7
  intl: ^0.18.1
  uuid: ^4.1.0
  flutter_dotenv: ^5.0.2
  emoji_picker_flutter: ^4.4.0

